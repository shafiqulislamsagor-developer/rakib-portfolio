services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rk-portfolio-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # The only variable the app needs; everything else is set in /admin.
      - MONGODB_URI=mongodb://mongo:27017/rk_portfolio
      - PORT=3000
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7.0
    container_name: rk-portfolio-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  mongo-data:
    driver: local
