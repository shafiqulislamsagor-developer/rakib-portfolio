name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  MONGOMS_DOWNLOAD_DIR: ~/.cache/mongodb-binaries

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # The integration tests start an in-memory MongoDB (downloaded on first run, then cached).
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-v1
      - run: pnpm test
      # No MONGODB_URI here: the build must succeed on the built-in fallback content.
      - run: pnpm build
